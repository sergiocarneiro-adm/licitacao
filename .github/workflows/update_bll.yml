name: 🔄 Atualizar Dados BLL

on:
  schedule:
    - cron: '0 6 * * *'    # 03:00 BRT (06:00 UTC)
  workflow_dispatch:

jobs:
  atualizar:
    name: Extração BLL Compras
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:

      - name: 📥 Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: 🐍 Configurar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 📦 Instalar dependências Python
        run: pip install playwright==1.49.0

      - name: 🌐 Instalar Chromium (Playwright)
        run: playwright install chromium --with-deps

      - name: 🖥️ Instalar Xvfb (display virtual)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y xvfb

      - name: 🗂️ Rodar extrator de Processos (headless=False via Xvfb)
        run: python extrator_bll_teixeira.py
        env:
          CI: 'true'
          # DISPLAY não é setado aqui — o próprio script inicia o Xvfb

      - name: 🛒 Rodar extrator de Compra Direta
        run: python compra_direta.py
        env:
          CI: 'true'

      - name: 💾 Commit dos JSONs atualizados
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add dados.json dados_compra_direta.json
          if git diff --cached --quiet; then
            echo "✅ Nenhuma mudança nos dados — commit ignorado."
          else
            TIMESTAMP=$(TZ='America/Bahia' date '+%d/%m/%Y %H:%M')
            git commit -m "🤖 Atualização automática BLL — ${TIMESTAMP}"
            git push
          fi
